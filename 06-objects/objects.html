<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objects in JavaScript</title>
    <description>
      // An object groups multiple values together.
      // destructuring
      // shorthand Property
      // shorthand Method
    </description>
  </head>
  <body>
    <!-- <script src="objects.js"></script> -->

    <script>
      // objects

      const product = {
        name: "socks",  // left side part is called property. and right side part is called values.
        price: 100
        // left and right side part both combined called "Property-value pair".
        // we seperate property and value with colon(:).
        // we can have many property value pairs in an object, we seperate them with a comma(,).
      };

      console.log(product);
      console.log(product.name); // accessing property -  with dot notation we can access propety value.
      console.log(product.price);
      console.log(product.quantity); // if we access a property that doesn't exist the value will be 'undefined'.

      product.newProperty = true; // adding a new property and value.
      console.log(product.newProperty);

      product.name = "wooden socks" // modifying property
      console.log(product.name);

      // If variable name and property name are equal, we actually have shortcut
      const object4 = {
        message: "good job",
        price: 899,
      };

      // const message = object4.message;
      // const price = object4.price; // this can be done like below.

      const { message, price } = object4; // destructuring
      console.log(message);
      console.log(price);

      const object5 = {
        // message: message, // It takes whatever is inside message variable and substitute in this message variable
        //  if property and variable name is same {message : message}, we have a shortcut for that, that is called shorthand property.
        message, // shorthand property

        // shorthand Method
        // method:function function1() {
        //   console.log('method');
        // }
        // we actually have shortcut to write that function`
        method() {
          // this is same as above method:function function1() {
          console.log("shorthand method");
        },
      };

      console.log(object5);
      object5.method(); // to run the above function.
    </script>
  </body>
</html>
