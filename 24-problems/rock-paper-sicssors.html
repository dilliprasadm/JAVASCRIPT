      function getComputerMove() {
        const randomNumber = Math.random();
        let computerMove = "";

        if (randomNumber >= 0 && randomNumber < 1 / 3) computerMove = "rock";
        if (randomNumber >= 1 / 3 && randomNumber < 2 / 3)
          computerMove = "paper";
        if (randomNumber >= 2 / 3 && randomNumber < 1)
          computerMove = "scissors";

        return computerMove;
      }

      function playGame(humanMove) {
        const computerMove = getComputerMove();
        let result = "";

        if (humanMove === "rock") {
          if (computerMove === "rock") {
            result = "Tie";
          } else if (computerMove === "paper") {
            result = "You Lose";
          } else if (computerMove === "scissors") {
            result = "You Win";
          }
        } else if (humanMove === "paper") {
          if (computerMove === "paper") {
            result = "Tie";
          } else if (computerMove === "scissors") {
            result = "You Lose";
          } else if (computerMove === "rock") {
            result = "You Win";
          }
        } else if (humanMove === "scissors") {
          if (computerMove === "scissors") {
            result = "Tie";
          } else if (computerMove === "rock") {
            result = "You Lose";
          } else if (computerMove === "paper") {
            result = "You Win";
          }
        }

        if (result === "You Win") {
          score.wins += 1;
        } else if (result === "You Lose") {
          score.looses += 1;
        } else if (result === "Tie") {
          score.ties += 1;
        }

        localStorage.setItem("score", JSON.stringify(score));

        alert(
          `You picked ${humanMove}. Computer picked ${computerMove}. Result "${result}"
Wins: ${score.wins}, Looses:  ${score.looses}, Ties: ${score.ties}`,
        );
      }
